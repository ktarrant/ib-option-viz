# The terminal look. Dark only: theme.DARK mirrors these colors for the charts,
# which Streamlit's theme doesn't reach — keep the two in step.

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#ffb000"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#121822"
textColor = "#e6edf3"
linkColor = "#ffb000"
borderColor = "#2a3342"
dataframeBorderColor = "#1a212c"
dataframeHeaderBackgroundColor = "#121822"
codeTextColor = "#ffb000"
codeBackgroundColor = "#121822"
greenColor = "#1fa865"
redColor = "#f0522a"
yellowColor = "#e8c547"
orangeColor = "#ffb000"
blueColor = "#0094c4"
violetColor = "#e23d9b"
grayColor = "#7d8796"
font = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap, monospace"
headingFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap, monospace"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap, monospace"
baseFontSize = 13
baseRadius = "none"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["1.5rem", "1.2rem", "1.05rem", "0.95rem"]
headingFontWeights = [700, 600, 600, 600]
metricValueFontSize = "1.35rem"

[theme.sidebar]
backgroundColor = "#121822"
secondaryBackgroundColor = "#0b0e14"
